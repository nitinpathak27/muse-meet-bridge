<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1623;
      color: #e8eef7;
      margin: 0;
    }
    h3 { margin: 0 0 6px; font-size: 15px; }
    p { margin: 0 0 10px; font-size: 12px; color: #8fa1bc; line-height: 1.4; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e8eef7;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #toggle-btn { background: #4f8cff; color: #fff; }
    #toggle-btn.stop { background: #ef4444; }
    #open-console-btn { background: #1e293b; color: #e8eef7; border: 1px solid #334155; }
    #status { font-size: 12px; color: #94a3b8; margin-top: 4px; word-break: break-word; }
  </style>
</head>
<body>
  <h3>🎙️ Muse Meet Bridge</h3>
  <p>Open your Google Meet tab and click Start to give Muse live ears.</p>
  <label for="bridge-url">Bridge Server URL (Render or localhost):</label>
  <input id="bridge-url" type="url" placeholder="https://muse-meet-bridge.onrender.com" />
  <button id="toggle-btn">▶ Start Listening to This Tab</button>
  <button id="open-console-btn">🖥 Open Muse Console</button>
  <div id="status">Status: Idle</div>
  <script src="popup.js"></script>
</body>
</html>
