name: Keep Render Server Awake

on:
  schedule:
    # Ping every 10 minutes (under Render's 15-minute spin-down threshold)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Muse Meet Bridge /health
        run: |
          curl -fsS --max-time 30 https://muse-meet-bridge.onrender.com/health || curl -fsS --max-time 30 https://muse-meet-bridge.onrender.com/api/state
          echo "Ping OK at $(date -u)"
